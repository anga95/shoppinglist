<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>shoppinglist</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="shoppinglist.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
</head>
<body>
    <div class="safe-overlay"></div>

    <div id="app">Loading...</div>
    
    <div id="blazor-error-ui" style="display:none">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    
    <!-- Blazor WebView bootstrap -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    
    <!-- Measure .topbar height and expose as CSS var --topbar-h -->
    <script>
        (function () {
            let tries = 0, ro;
    
            function setTopbarHeight() {
                const bar = document.querySelector('.topbar');
                if (!bar) return;
    
                const h = bar.getBoundingClientRect().height;
                document.documentElement.style.setProperty('--topbar-h', h + 'px');
            }
    
            function initObserver() {
                const bar = document.querySelector('.topbar');
                if (!bar) return false;
    
                // Mät direkt
                setTopbarHeight();
    
                // Observers
                ro?.disconnect();
                ro = new ResizeObserver(setTopbarHeight);
                ro.observe(bar);
    
                window.addEventListener('resize', setTopbarHeight);
                if (window.visualViewport) {
                    visualViewport.addEventListener('resize', setTopbarHeight);
                }
                return true;
            }
    
            // Försök initiera när DOM:en är klar
            window.addEventListener('DOMContentLoaded', function () {
                if (initObserver()) return;
    
                // Fallback: prova några gånger ifall .topbar renderas lite senare
                const tick = () => {
                    if (initObserver() || ++tries > 8) return;
                    setTimeout(tick, Math.min(500, 50 * tries)); // 0ms…400ms
                };
                tick();
            });
        })();
    </script>
</body>
</html>
